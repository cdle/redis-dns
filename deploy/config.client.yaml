# Client-side (LAN) deployment config — copy to /etc/redis-dns/config.client.yaml
# and fill in the real Redis password.
redis:
  addr: "127.0.0.1:6380"  # server-side Redis (bwg)
  password: "CHANGE_ME"
  db: 0
  socks5: "127.0.0.1:1080"  # route Redis through local SOCKS5 proxy (ni-client); empty = direct

listen: "127.0.0.1:5353"
doh_listen: "127.0.0.1:5354"  # optional DoH (RFC 8484) endpoint; empty disables
local_ttl: 300
block_time: 5
