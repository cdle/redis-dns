# redis-dns server-side instance. Runs on the resolver host (bwg).
#
# Loopback only — this instance is NEVER exposed to the public internet. The
# LAN client reaches it through an SSH local-forward tunnel.

bind 127.0.0.1
port 6379
protected-mode yes

# Replace with a strong password; clients must send it via AUTH.
requirepass CHANGE_ME_STRONG_PASSWORD

appendonly yes
appendfsync everysec

maxmemory 256mb
maxmemory-policy allkeys-lru
