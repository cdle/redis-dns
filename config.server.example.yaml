# Server-side (bwg) example — run: redis-dns-server -config config.server.yaml
redis:
  addr: "127.0.0.1:6380"
  password: "CHANGE_ME"
  db: 0

upstream:
  addr: "8.8.8.8:53"   # upstream recursive resolver (or 1.1.1.1)
  network: "udp"
  timeout: 5

group: "dns"
consumer: "resolver"
workers: 4          # concurrent consumer workers; 0 = 1
cache_ttl: 300      # Redis cache TTL ceiling, seconds; 0 disables caching
neg_ttl: 60         # negative (NXDOMAIN) cache TTL ceiling, seconds; 0 disables
resp_max: 1000      # response stream MAXLEN cap

prefetch:
  interval: 60      # seconds between hot-domain refresh sweeps; 0 disables
  topn: 50          # also keep this many top-queried names warm (from dns:count:q)
  decay_hours: 24   # query-count half-life: rankings track recent demand

race:               # answer racing: probe multi-IP answers concurrently and
  enabled: true     # keep only the fastest IP (enabled unless set false)
  ports: [443, 80]  # probe ports in priority order
  timeout_ms: 1000  # overall probe budget; no answer in time = keep upstream answer
  tcp_deadline_ms: 200 # TCP gets this long to answer before ICMP results take over
  icmp: true        # also probe with ICMP echo (the only signal for non-web hosts)
  pref_ttl: 86400   # remember each race winner this long, seconds
  pref_neg_ttl: 600 # remember "nobody answered" this long, seconds
  recheck_hits: 100 # race again after this many preferred-IP reuses
  recheck_age: 21600 # ...or after the remembered winner is this old, seconds

# Fixed domains to refresh on schedule (A records): field=fqdn, value=interval
# seconds. Populate the hash on Redis, e.g.:
#   HSET dns:hot:domains "google.com" 300 "www.youtube.com" 300
