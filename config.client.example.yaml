# Client-side (LAN) example — run: redis-dns-client -config config.client.yaml
redis:
  addr: "127.0.0.1:6379"  # through the SSH tunnel to the server host
  password: "CHANGE_ME"
  db: 0

listen: "0.0.0.0:53"
local_ttl: 300   # seconds; local in-memory cache
block_time: 5    # seconds; how long to wait for a resolution
