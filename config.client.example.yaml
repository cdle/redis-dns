# Client-side (LAN) example — run: redis-dns-client -config config.client.yaml
redis:
  addr: "bwg.example.com:6380"  # server host's Redis, reached via SOCKS5 below
  socks5: "127.0.0.1:1080"      # optional SOCKS5 proxy; empty = direct
  password: "CHANGE_ME"
  db: 0

listen: "0.0.0.0:53"
doh_listen: "127.0.0.1:5354"  # optional DoH (RFC 8484) endpoint; empty disables
local_ttl: 300   # fallback local-cache TTL when the wire carries no usable TTL
block_time: 5    # seconds; how long to wait for a resolution response
